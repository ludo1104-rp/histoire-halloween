<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Histoire Halloween">
<title>Invente une histoire d'Halloween</title>
<style>
:root{
  --scale:1;
  --bg:#F4EFF5; --card:#FFFFFF; --ink:#3A2E42; --ink-soft:#6E6178; --line:#E6DDE9;
  --pumpkin:#F8D2B0; --sage:#D3E6CB; --plum:#E2D3EE; --mustard:#F6E4AE; --rose:#F6CDD6;
  --primary:#5B4470; --on-primary:#FFFFFF; --on-pastel:#3A2E42;
  --die:#F5B583; --die-pip:#3A2E42; --veil:rgba(58,46,66,.35);
  --liquid-0:#F8D2B0; --liquid-1:#D3E6CB; --liquid-2:#E2D3EE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#231C2B; --card:#2F2638; --ink:#F2EAF5; --ink-soft:#B9AEC3; --line:#45394F;
    --pumpkin:#EEC6A3; --sage:#C6DDBD; --plum:#D6C4E6; --mustard:#EBD69C;
    --primary:#D9B8EE; --on-primary:#231C2B; --veil:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#231C2B; --card:#2F2638; --ink:#F2EAF5; --ink-soft:#B9AEC3; --line:#45394F;
  --pumpkin:#EEC6A3; --sage:#C6DDBD; --plum:#D6C4E6; --mustard:#EBD69C;
  --primary:#D9B8EE; --on-primary:#231C2B; --veil:rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;font-size:calc(20px * var(--scale));scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-weight:normal;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font-family:inherit;cursor:pointer}
#app{--k:1;--ks:1;height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;padding:16px 24px 20px}

/* En-tête : Accueil à gauche, Écouter à droite, toujours */
.top{display:flex;align-items:center;gap:16px;flex:none;height:60px;position:relative;z-index:11}
.round{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;flex:none}
.round svg{width:26px;height:26px}
.round.speaking{background:var(--plum);border-color:var(--plum);color:var(--on-pastel)}
.spacer{width:56px;flex:none}
.progress{flex:1;display:flex;gap:6px}
.seg{flex:1;height:8px;border-radius:99px;background:var(--line)}
.seg.done{background:var(--primary)}
.seg.now{background:var(--die)}

main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:calc(20px * var(--k));padding:calc(16px * var(--k)) 0;text-align:center}
/* Centrage vertical sans couper le haut quand le contenu est trop long */
#app:not(.two-col) main:not(.write) > :first-child{margin-top:auto}
#app:not(.two-col) main:not(.write) > :last-child{margin-bottom:auto}
footer{flex:none;display:flex;gap:14px;justify-content:center;padding-top:12px}

.btn{font-size:1.15rem;min-height:64px;padding:0 30px;border-radius:999px;border:2px solid transparent;flex:1;max-width:340px;
  display:flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:26px;height:26px;flex:none}
.btn.primary{background:var(--primary);color:var(--on-primary)}
footer .btn{max-width:400px;padding:0 22px}
.btn.secondary{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4}
.btn:active,.round:active,.die-btn:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--die);outline-offset:3px}

.chip{display:inline-block;padding:6px 16px;border-radius:999px;color:var(--on-pastel);font-size:.95rem}
.title{font-size:1.9rem;font-weight:normal;line-height:1.2}
.sub{font-size:1.1rem;color:var(--ink-soft);line-height:1.4}
.q{font-size:1.7rem;font-weight:normal;line-height:1.25}

/* Accueil */
.home-art{max-width:100%}
.home-art svg{width:calc(320px * var(--k));max-width:100%;height:auto;display:block}
.steps{list-style:none;display:flex;flex-direction:column;gap:calc(10px * var(--k));width:100%;max-width:520px;text-align:left}
.steps li{display:flex;align-items:center;gap:14px;font-size:1.15rem;line-height:1.3}
.num{width:max(40px,calc(52px * var(--k)));height:max(40px,calc(52px * var(--k)));border-radius:50%;display:grid;place-items:center;color:var(--on-pastel);flex:none}
.num svg{width:78%;height:78%;display:block}
.reglages{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 32px;width:100%}
.reg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.reg-label{font-size:16px;color:var(--ink-soft)}
.pills{display:flex;gap:8px}
.pill{min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--on-pastel)}
main.home > .reglages{margin-top:0;margin-bottom:auto}
.credit{font-size:.75rem;color:var(--ink-soft)}

/* Accueil en 2 colonnes quand la hauteur manque (iPad horizontal, appli dans claude.ai) */
#app.two-col{max-width:1100px}
#app.two-col main.home{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto auto 1fr;column-gap:48px;row-gap:calc(16px * var(--k));justify-items:center;align-items:center}
#app.two-col main.home .reglages{grid-column:1 / -1;grid-row:1;margin:0}
#app.two-col main.home .home-art{grid-column:1;grid-row:3}
#app.two-col main.home .title{grid-column:1;grid-row:4;align-self:start}
#app.two-col main.home .steps{grid-column:2;grid-row:3 / span 2;align-self:center}

/* Boutons en haut à gauche */
.left-btns{display:flex;gap:10px;flex:none}

/* Chaudron magique */
.cauldron-wrap{position:relative;width:calc(340px * var(--k));max-width:100%;flex:none;touch-action:none;cursor:grab}
.cauldron-wrap svg{width:100%;height:auto;display:block}
.stir-bar{width:min(300px,60vw);height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.stir-fill{height:100%;width:0;border-radius:99px;background:var(--primary)}
.bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.8);pointer-events:none;animation:rise 1s ease-out forwards}
@keyframes rise{from{transform:translateY(0) scale(.4);opacity:1}to{transform:translateY(-80px) scale(1);opacity:0}}
.big-bubble{position:absolute;left:50%;top:26%;width:48%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.88);border:4px solid #fff;
  display:grid;place-items:center;pointer-events:none;animation:bigrise .9s ease-out forwards}
.big-bubble svg{width:72%;height:72%}
.big-bubble.pop{animation:pop .3s ease-in forwards}
@keyframes bigrise{from{transform:translate(-50%,0) scale(.15)}to{transform:translate(-50%,-70%) scale(1)}}
@keyframes pop{from{transform:translate(-50%,-70%) scale(1);opacity:1}to{transform:translate(-50%,-70%) scale(1.35);opacity:0}}

/* Mentions en bas de l'accueil */
.legal{flex:none;text-align:center;font-size:.7rem;line-height:1.5;color:var(--ink-soft);padding-top:12px}

/* Panneau qui monte du bas */
.veil{position:fixed;inset:0;background:var(--veil);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:820px;max-height:var(--sheet-max,100%);overflow-y:auto;border-radius:36px 36px 0 0;padding:calc(14px * var(--ks)) 28px calc(26px * var(--ks) + env(safe-area-inset-bottom,0px));text-align:center;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:56px;height:6px;border-radius:99px;background:var(--line);margin:0 auto calc(14px * var(--ks))}
.cheer{font-size:1.25rem;color:var(--ink-soft)}
.sheet-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:calc(12px * var(--ks))}
.mini-die{width:42px;height:42px}
.mini-die svg{width:100%;height:100%}
.result{display:flex;flex-direction:column;align-items:center;gap:calc(16px * var(--ks));margin:calc(18px * var(--ks)) 0 calc(24px * var(--ks))}
.illu{width:calc(150px * var(--ks));height:calc(150px * var(--ks));border-radius:calc(40px * var(--ks));display:grid;place-items:center;flex:none}
.illu svg{width:84%;height:84%}
.result-text{font-size:1.8rem;line-height:1.25;max-width:22ch}
.sheet .actions{display:flex;gap:14px;justify-content:center}

/* Récapitulatif */
.cards{display:flex;flex-direction:column;gap:calc(12px * var(--k));width:100%;max-width:640px}
.el-card{display:flex;align-items:center;gap:18px;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:calc(12px * var(--k)) 20px calc(12px * var(--k)) 12px;text-align:left}
.el-card .illu{width:calc(96px * var(--k));height:calc(96px * var(--k));border-radius:calc(24px * var(--k))}
.el-card p{font-size:1.3rem;line-height:1.25;margin-top:6px}
.choice{display:flex;gap:14px;width:100%;max-width:640px;justify-content:center}

/* Écrire */
main.write{justify-content:flex-start;align-items:stretch;text-align:left}
.minis{display:flex;flex-wrap:wrap;gap:8px}
.mini{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;font-size:.9rem;color:var(--on-pastel);line-height:1.2}
.mini .dot{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.mini .dot svg{width:88%;height:88%}
textarea{flex:1;min-height:140px;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:1.25rem;line-height:1.6;padding:20px 22px;border-radius:28px;
  border:2px solid var(--line);background:var(--card);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
textarea:focus{outline:none;border-color:var(--die)}
textarea::placeholder{color:var(--ink-soft);opacity:.7}
footer.split{justify-content:space-between;align-items:center}
.count{color:var(--ink-soft);font-size:1rem}

/* Fin */
.story{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:20px 24px;text-align:left;width:100%;max-width:640px;
  white-space:pre-wrap;font-size:1.15rem;line-height:1.6;-webkit-user-select:text;user-select:text;flex:none}
/* Fin : l'histoire entière doit tenir à l'écran pour la capture.
   fit() cache d'abord l'illustration, puis réduit le texte ; le défilement n'est qu'un dernier recours. */
main.tight .home-art{display:none}
#app.wide{max-width:1200px}
#app.wide .story{max-width:none}
main.story-scroll .story{flex:0 1 auto;min-height:5.5em;overflow-y:auto}
.tip{display:flex;align-items:center;gap:10px;background:var(--mustard);color:var(--on-pastel);padding:12px 22px;border-radius:999px;font-size:1rem;text-align:left}
.tip svg{width:24px;height:24px;flex:none}

@media (prefers-reduced-motion: reduce){
  .sheet,.bubble{animation:none}
}

/* Ouverture façon rprof1.com : le titre, puis le point tombe, rebondit et se pose (≈ 1,5 s). */
.ouverture{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.ouverture-mot{max-width:14ch;text-align:center;font-family:"Figtree","Avenir Next",Arial,sans-serif;font-size:clamp(44px,9vw,92px);font-weight:600;letter-spacing:-.045em;line-height:1.02;color:var(--ink)}
.ouverture-point{display:inline-block;transform-origin:50% 85%;width:.55em;height:.55em;margin-left:.06em;vertical-align:baseline}
.ouverture-point svg{display:block;width:100%;height:100%}
/* Étiquette « Nouveau » à côté du bouton Simple (couleurs fixes, lisibles en clair et en sombre) */
.nouveau{margin-left:4px;padding:1px 8px;border-radius:999px;font-size:12px;line-height:1.6;background:#FAF0C8;color:#1F2933}

/* Style « Simple » = charte de rprof1.com : blanc, noir, gris, une seule police (Figtree, incluse).
   Classe sur body, jamais data-theme. Toujours clair, même si l'iPad est en mode sombre.
   Restent en couleur : les petites illustrations des éléments et le liquide du chaudron. */

const KEY = "histoire-halloween-v1";

const fresh = () => ({screen:"home", col:0, rolls:[null,null,null], text:"", mode:null, resume:null,
  scale:(state&&state.scale)||1, style:(state&&state.style)||"couleurs", nouveau:state?state.nouveau:0});
let state = null;
try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.rolls)) state = s; }catch(e){}

/* Données de la v1.1 : tailles 1 · 1,15 · 1,3 ; pas de style. Rien n'est perdu, on ramène à la valeur la plus proche. */
if(!SIZES.includes(state.scale)) state.scale = state.scale > 1.15 ? 1.15 : 1;
if(state.style!=="simple") state.style = "couleurs";

if(state.nouveau>=0) state.nouveau++;
if(state.screen!=="home"){ state.resume = state.screen==="end" ? null : state.screen; state.screen="home"; }
let ui = {sheet:false, rolling:false, stir:0, angle:0, lastBubble:0, auto:false, prev:null, cheer:CHEERS[0], confirmNew:false};
let confirmTimer = null;
function resetStir(){ ui.stir=0; ui.angle=0; ui.auto=false; }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function applyScale(){ document.documentElement.style.setProperty("--scale", state.scale); }
function applyStyle(){ document.body.classList.toggle("simple", state.style==="simple"); }
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const item = i => COLS[i].items[state.rolls[i]];
const words = t => t.trim().split(/\s+/).filter(Boolean).length;

function segments(){
  let out="";
  for(let i=0;i<4;i++){
    let cls="";
    if(state.screen==="roll"){ if(i<state.col || (i===state.col && state.rolls[i]!==null)) cls="done"; else if(i===state.col) cls="now"; }
    else if(state.screen==="end"){ cls="done"; }
    else { cls = i<3 ? "done" : "now"; }
    out+=`<div class="seg ${cls}"></div>`;
  }
  return out;
}

function speechText(){
  const els = () => [0,1,2].map(i=>`${COLS[i].label} : ${item(i).t}.`).join(" ");
  switch(state.screen){
    case "home": return "Invente une histoire d'Halloween. Remue le chaudron 3 fois. Tu trouves ton personnage, ton cadre et ta péripétie. Invente ton histoire."

    case "recap": return `Voici tes 3 éléments. ${els()} Invente une histoire avec ces 3 éléments. Où veux-tu écrire ? Sur l'iPad ou sur papier ?`;

/* ============================================================
   ACTIONS
   ============================================================ */
const app = document.getElementById("app");
function render(){
  if(state.screen==="roll" && !ui.rolling && state.rolls[state.col]!==null) ui.sheet=true;
  app.innerHTML = SCREENS[state.screen]();
  if(state.screen==="roll" && !ui.sheet){ bindCauldron(); updateCauldron(); }
  fit();
  observeMain();
  const ta = document.getElementById("story");
  if(ta){
    ta.addEventListener("input", ()=>{
      state.text = ta.value; save();
      const n = words(state.text);
      document.getElementById("count").textContent = `${n} mot${n>1?"s":""}`;
      document.getElementById("doneBtn").disabled = !n;
    });
  }
}
/* ============================================================
   MISE EN PAGE ADAPTATIVE
   Les tailles sont calculées à partir de l'espace réellement mesuré
   (zone <main> et hauteur du cadre), puis recalculées à chaque
   changement : rotation, partage d'écran, texte sur 2 lignes…
   ============================================================ */
function fit(){
  const m = app.querySelector("main"); if(!m) return;
  const setK = k => app.style.setProperty("--k", k);
  const over = () => m.scrollHeight > m.clientHeight + 1;
  const shrink = () => { let k=1; setK(k); while(over() && k>0.55){ k=Math.round((k-0.05)*100)/100; setK(k); } };
  m.classList.add("measuring");
  app.classList.remove("two-col","wide");
  m.classList.remove("tight","story-scroll");
  const story = m.querySelector(".story");
  if(story) story.style.fontSize = "";
  shrink();
  if(over() && m.classList.contains("home") && app.clientWidth >= 640){ app.classList.add("two-col"); shrink(); }
  /* Fin sur iPad : toute l'histoire visible pour la capture d'écran */
  if(story && over()){
    m.classList.add("tight"); shrink();
    if(over() && document.documentElement.clientWidth >= 900){ app.classList.add("wide"); shrink(); }  /* iPad horizontal : texte plus large */
    let fs = 1.15;
    while(over() && fs > 0.8){ fs = Math.round((fs-0.05)*100)/100; story.style.fontSize = fs+"rem"; }
    if(over()) m.classList.add("story-scroll");
  }
  m.classList.remove("measuring");
  fitSheet();
}
function fitSheet(){
  const sh = document.querySelector(".sheet"); if(!sh) return;
  const top = app.querySelector(".top").getBoundingClientRect().bottom;
  const avail = Math.max(200, document.documentElement.clientHeight - top - 12);
  app.style.setProperty("--sheet-max", avail+"px");
  let k=1; sh.style.setProperty("--ks", k);
  while(sh.scrollHeight > avail + 1 && k>0.55){ k=Math.round((k-0.05)*100)/100; sh.style.setProperty("--ks", k); }
}
let ro=null, fitQueued=false, lastSize="";
function queueFit(){ if(fitQueued) return; fitQueued=true; requestAnimationFrame(()=>{ fitQueued=false; fit(); }); }
function observeMain(){
  if(!("ResizeObserver" in window)) return;
  if(!ro) ro = new ResizeObserver(entries=>{
    const r = entries[0].contentRect, key = Math.round(r.width)+"x"+Math.round(r.height);
    if(key!==lastSize){ lastSize=key; queueFit(); }
  });
  ro.disconnect(); lastSize="";
  const m = app.querySelector("main"); if(m) ro.observe(m);
}
window.addEventListener("resize", queueFit);
window.addEventListener("orientationchange", ()=>setTimeout(queueFit, 200));

function go(screen){ stopSpeech(); state.screen=screen; save(); render(); }

function bindCauldron(){
  const wrap = app.querySelector(".cauldron-wrap"); if(!wrap) return;
  let last=null;
  wrap.addEventListener("pointerdown", e=>{ if(ui.rolling) return; e.preventDefault(); try{wrap.setPointerCapture(e.pointerId);}catch(_){} last={x:e.clientX,y:e.clientY}; });
  wrap.addEventListener("pointermove", e=>{
    if(!last || ui.rolling) return;
    const d=Math.hypot(e.clientX-last.x, e.clientY-last.y);
    last={x:e.clientX,y:e.clientY};
    stir(Math.min(d,60));
  });
  const end=()=>{ last=null; };
  wrap.addEventListener("pointerup", end); wrap.addEventListener("pointercancel", end);
}
function updateCauldron(){
  const sw=document.getElementById("swirl"), sl=document.getElementById("spoonLine"), st=document.getElementById("spoonTip"), f=document.getElementById("stirFill");
  if(!sw) return;
  sw.setAttribute("transform", `rotate(${(ui.angle*57.3)%360})`);
  const tx=150+55*Math.cos(ui.angle), ty=130+11*Math.sin(ui.angle);
  sl.setAttribute("x1",tx); sl.setAttribute("y1",ty); sl.setAttribute("x2",tx+70); sl.setAttribute("y2",30);
  st.setAttribute("cx",tx); st.setAttribute("cy",ty);
  f.style.width = Math.round(ui.stir*100)+"%";
}
function spawnBubble(){
  const wrap=app.querySelector(".cauldron-wrap"); if(!wrap) return;
  const b=document.createElement("span"); b.className="bubble";
  const s=10+Math.random()*16;
  b.style.width=b.style.height=s+"px";
  b.style.left=(30+Math.random()*40)+"%"; b.style.top=(40+Math.random()*4)+"%";
  b.addEventListener("animationend", ()=>b.remove());
  wrap.appendChild(b);
}
function stir(d){
  if(ui.rolling) return;
  ui.stir=Math.min(1, ui.stir + d/1100);
  ui.angle += d*0.03;
  updateCauldron();
  const now=performance.now();
  if(now-ui.lastBubble>140){ spawnBubble(); ui.lastBubble=now; }
  if(ui.stir>=1) reveal();
}
function autoStir(){
  if(ui.rolling || ui.auto) return;
  ui.auto=true;
  let prev=performance.now();
  const step=t=>{
    if(!ui.auto || ui.rolling || state.screen!=="roll"){ ui.auto=false; return; }
    stir(Math.min(t-prev,50)*0.75); prev=t;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function reveal(){
  ui.rolling=true; ui.auto=false;
  const btn=document.getElementById("rollBtn"); if(btn) btn.disabled=true;
  let n; do{ n=Math.floor(Math.random()*6); } while(n===ui.prev);
  ui.prev=null;
  state.rolls[state.col]=n; save();
  const wrap=app.querySelector(".cauldron-wrap");
  const big=document.createElement("div"); big.className="big-bubble";
  big.innerHTML=ART[COLS[state.col].items[n].art];
  wrap.appendChild(big);
  setTimeout(()=>big.classList.add("pop"), 950);
  setTimeout(()=>{ ui.rolling=false; ui.sheet=true; ui.cheer=CHEERS[Math.floor(Math.random()*CHEERS.length)]; render(); }, 1250);
}
function goBack(){
  stopSpeech(); ui.auto=false; ui.sheet=false; resetStir();
  const s=state.screen;
  if(s==="roll"){ if(state.col>0){ state.col--; go("roll"); } else { state.resume="roll"; go("home"); } }
  else if(s==="recap"){ state.col=2; go("roll"); }
  else if(s==="write" || s==="paper"){ go("recap"); }
  else if(s==="end"){ go(state.mode==="ipad" ? "write" : "paper"); }
}

let speaking=false;
function stopSpeech(){ if("speechSynthesis" in window) speechSynthesis.cancel(); speaking=false; }
function speak(txt){
  if(!("speechSynthesis" in window) || !txt) return;
  if(speaking){ stopSpeech(); setListen(false); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang="fr-FR"; u.rate=0.9;
  const v = speechSynthesis.getVoices().filter(x=>x.lang && x.lang.toLowerCase().startsWith("fr"));
  const pick = v.find(x=>/fr-be/i.test(x.lang)) || v.find(x=>/fr-fr/i.test(x.lang)) || v[0];
  if(pick) u.voice=pick;
  u.onend = u.onerror = ()=>{ speaking=false; setListen(false); };
  speaking=true; setListen(true);
  speechSynthesis.speak(u);
}
function setListen(on){ const b=document.getElementById("listen"); if(b) b.classList.toggle("speaking", on); }
if("speechSynthesis" in window) speechSynthesis.getVoices();

app.addEventListener("click", e=>{
  const b = e.target.closest("[data-action]"); if(!b || b.disabled) return;
  const a = b.dataset.action;
  if(a==="listen"){ speak(speechText()); return; }
  if(a==="home"){ if(state.screen!=="end") state.resume=state.screen; ui.sheet=false; ui.auto=false; resetStir(); go("home"); return; }
  if(a==="back"){ if(!ui.rolling) goBack(); return; }
  if(a==="start"){
    /* Une histoire est en cours : 2 touchers pour l'effacer (le 1er change le bouton pendant 3 secondes) */
    if(state.screen==="home" && state.resume && !ui.confirmNew){
      ui.confirmNew=true; render();
      clearTimeout(confirmTimer); confirmTimer=setTimeout(()=>{ ui.confirmNew=false; if(state.screen==="home") render(); }, 3000);
      return;
    }
    clearTimeout(confirmTimer); ui.confirmNew=false;
    state=fresh(); state.col=0; ui.sheet=false; resetStir(); go("roll"); return; }
  if(a==="continue"){ const r=state.resume; if(!r || !SCREENS[r]) return; clearTimeout(confirmTimer); ui.confirmNew=false; state.resume=null; go(r); return; }
  if(a==="style"){ state.nouveau=-1; state.style = b.dataset.v==="simple" ? "simple" : "couleurs"; applyStyle(); save(); render(); return; }
  if(a==="size"){ const v=parseFloat(b.dataset.v); if(SIZES.includes(v)){ state.scale=v; applyScale(); save(); render(); } return; }
  if(a==="autostir"){ autoStir(); return; }
  if(a==="reroll"){ stopSpeech(); ui.prev=state.rolls[state.col]; state.rolls[state.col]=null; ui.sheet=false; resetStir(); save(); render(); return; }
  if(a==="next"){ ui.sheet=false; resetStir(); if(state.col<2){ state.col++; go("roll"); } else go("recap"); return; }
  if(a==="ipad"){ state.mode="ipad"; go("write"); return; }
  if(a==="paper"){ state.mode="paper"; go("paper"); return; }
  if(a==="done"){ state.resume=null; go("end"); return; }
  if(a==="edit"){ go("write"); return; }
});

/* ============================================================
   OUVERTURE façon rprof1.com : le titre s'affiche, le point tombe, rebondit en changeant
   de couleur (pastels du site) et se pose. Une fois par session, sautée au toucher,
   jamais si l'iPad demande moins d'animations ni pendant les tests automatiques (#ouverture pour la filmer).
   ============================================================ */
/* Halloween : une petite citrouille remplace le point du site */
const CITROUILLE=`<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 9c0-3 1-5 4-6" stroke="#7FB069" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="13" cy="24" rx="10" ry="12" fill="#E8894A"/><ellipse cx="27" cy="24" rx="10" ry="12" fill="#E8894A"/><ellipse cx="20" cy="24" rx="9" ry="13" fill="#F4A261"/></svg>`;
function ouverture(){
  let vu=null; try{ vu=sessionStorage.getItem(KEY+"-ouverture"); sessionStorage.setItem(KEY+"-ouverture","1"); }catch(e){}
  if(vu || !("animate" in Element.prototype) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(navigator.webdriver && location.hash!=="#ouverture") return;
  const o=document.createElement("div"); o.className="ouverture"; o.setAttribute("aria-hidden","true");
  o.innerHTML=`<span class="ouverture-mot">Invente une histoire d'Halloween<span class="ouverture-point">${CITROUILLE}</span></span>`;
  document.body.appendChild(o);
  const p=o.querySelector(".ouverture-point"); let fini=false;
  const fermer=()=>{ if(fini) return; fini=true; o.animate([{opacity:1},{opacity:0}],{duration:280,fill:"forwards"}).finished.then(()=>o.remove()); };
  ["pointerdown","keydown"].forEach(t=>addEventListener(t,fermer,{once:true,passive:true}));
  const bas="cubic-bezier(.5,0,1,.6)", haut="cubic-bezier(0,.4,.5,1)";
  p.animate([
    {transform:"translateY(-1.7em) scale(.9,1.15)",opacity:0,offset:0},
